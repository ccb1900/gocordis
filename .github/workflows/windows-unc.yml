name: windows-unc

# Re-run after MSYS path fixes so the evidence head_sha follows the code.
# Browser-level UNC acceptance has its own workflow and evidence row.
# Re-running this file re-binds the evidence to the newly tested head sha.
# Product fixes must carry their own UNC evidence row.
# Each push of this workflow re-binds the evidence to the tested head sha.
# The run id produced by this workflow is recorded in
# artifacts/windows-unc-result.json with the head_sha it tested. The unified
# report treats evidence from any other commit as not-executed.

on:
  workflow_dispatch:
  push:
    branches: [dotnet]
    paths:
      - 'industrial/**'
      - '.github/workflows/windows-unc.yml'

permissions:
  contents: read

jobs:
  unc-integration:
    name: Windows UNC/SMB integration test
    runs-on: windows-latest
    env:
      GOCORDIS_UNC_PATH: ${{ secrets.GOCORDIS_UNC_PATH }}
      GOCORDIS_UNC_USER: ${{ secrets.GOCORDIS_UNC_USER }}
      GOCORDIS_UNC_PASSWORD: ${{ secrets.GOCORDIS_UNC_PASSWORD }}
      GOCORDIS_UNC_DOMAIN: ${{ secrets.GOCORDIS_UNC_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run WindowsUncIntegrationTests
        shell: pwsh
        run: |
          try {
            ./industrial/e2e-windows-unc.ps1 2>&1 | Tee-Object -FilePath unc-run.log
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
              throw "Windows UNC script exited with $LASTEXITCODE"
            }
          } catch {
            $message = ($_.Exception.Message -replace "`r|`n", " ")
            if (Test-Path unc-run.log) {
              $tail = ((Get-Content unc-run.log -Tail 20) -join " | ")
              $message = "$message | $tail"
            }
            Write-Host "::error::$message"
            throw
          }
