name: linux-dotnet

# Linux verification for the .NET migration: same lifecycle/ALC/process
# assertions as the Windows job, plus POSIX shell plugin fixtures.
on:
  push:
    branches: [main, migration/dotnet]
  pull_request:
    branches: [main, migration/dotnet]

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Gocordis.sln --nologo -m:1
      - name: Test
        run: dotnet test Gocordis.sln --nologo --no-build -m:1
