name: windows-unc-browser

# Evidence rebind: re-run on packaging fixes because packaged UI is part of this story.
# Evidence rebind: browser-level acceptance for the Windows UNC UI story. The run id and tested
# head sha are recorded in artifacts/windows-unc-browser-result.json.

on:
  workflow_dispatch:
  push:
    branches: [dotnet]
    paths:
      - 'industrial/**'
      - '.github/workflows/windows-unc-browser.yml'

permissions:
  contents: read
  checks: write

jobs:
  unc-browser:
    name: blank-environment UNC browser E2E
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: industrial/web/package-lock.json
      - name: Run UNC browser E2E
        shell: pwsh
        run: |
          try {
            ./industrial/e2e-unc-browser.ps1 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/unc-browser.log"
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) { throw "script exit $LASTEXITCODE" }
          } catch {
            $tail = if (Test-Path unc-browser.log) { ((Get-Content unc-browser.log -Tail 25) -join " | ") } else { $_.Exception.Message }
            Write-Host "::error::$tail"
            throw
          }
      - name: Publish UNC browser diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logPath = require('path').join(process.env.GITHUB_WORKSPACE || '.', 'unc-browser.log');
            const tail = fs.existsSync(logPath)
              ? fs.readFileSync(logPath, 'utf8').slice(-8000)
              : 'no browser log was produced at ' + logPath;
            const resultDir = require('path').join(process.env.GITHUB_WORKSPACE || '.', 'industrial', 'web', 'test-results');
            let contextText = '';
            if (fs.existsSync(resultDir)) {
              for (const dir of fs.readdirSync(resultDir)) {
                const file = require('path').join(resultDir, dir, 'error-context.md');
                if (fs.existsSync(file)) contextText += '\n--- ' + dir + ' ---\n' + fs.readFileSync(file, 'utf8').slice(-6000);
              }
            }
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'unc-browser-diagnostics-' + context.sha.substring(0, 7),
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Windows UNC browser E2E tail',
                summary: 'Tail of the real-browser UNC acceptance run',
                text: tail + '\n\nBROWSER ERROR CONTEXT:' + (contextText || ' none'),
              },
            });
