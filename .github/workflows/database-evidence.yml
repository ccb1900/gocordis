name: database-evidence

# Delete locator rebind: re-run after portable payload path fixes so the evidence head_sha follows the code.
# Resource reference guards are part of the tested product surface.
# Run ids are recorded in artifacts/{sqlserver,mysql}-result.json together with
# the head_sha they tested; the unified report rejects stale evidence.

on:
  workflow_dispatch:
  push:
    branches: [dotnet]
    paths:
      - 'industrial/**'
      - '.github/workflows/database-evidence.yml'

permissions:
  contents: read

jobs:
  sqlserver:
    name: SQL Server real-server integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: Gocordis!2026Sql
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Wait for SQL Server listener
        run: |
          for attempt in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              echo "SQL Server is accepting connections"
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server did not become ready" >&2
          exit 1
      - name: SqlServerSinkTests against a real server
        id: sqlserver_test
        run: |
          set -o pipefail
          # The TCP listener opens before SQL authentication is ready. Retry the
          # real test itself; every attempt talks to the same real SQL Server.
          for attempt in $(seq 1 12); do
            echo "SQL Server integration attempt $attempt"
            if GOCORDIS_SQLSERVER_CONNECTION="Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Gocordis!2026Sql;TrustServerCertificate=True;Encrypt=False" \
              dotnet test industrial/tests/Industrial.Database.Tests/Industrial.Database.Tests.csproj \
                --nologo -m:1 --filter FullyQualifiedName~SqlServerSink 2>&1 | tee /tmp/sqlserver-test.log; then
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server integration failed after bounded retries" >&2
          exit 1
  mysql:
    name: MySQL real-server integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Gocordis!2026MySql
          MYSQL_DATABASE: gocordis
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pGocordis!2026MySql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: MySqlSinkTests against a real server
        run: |
          GOCORDIS_MYSQL_CONNECTION="Server=127.0.0.1;Port=3306;Database=gocordis;Uid=root;Pwd=Gocordis!2026MySql;AllowUserVariables=True" \
            dotnet test industrial/tests/Industrial.Database.Tests/Industrial.Database.Tests.csproj \
              --nologo -m:1 --filter FullyQualifiedName~MySqlSink
