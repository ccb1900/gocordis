name: ci

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: linux .NET + frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - name: Plugin kit tests
        working-directory: web/plugin-kit
        run: npm ci && npm test

      - name: Console tests and production build
        working-directory: web/console
        run: npm ci && npm test && npx tsc --noEmit && npm run build

      - name: Build (.NET solution)
        run: dotnet build Gocordis.sln --nologo -m:1

      - name: Build (PlatformHost sample)
        run: dotnet build samples/PlatformHost/PlatformHost.csproj --nologo -m:1

      - name: Test (.NET solution)
        run: dotnet test Gocordis.sln --nologo --no-build -m:1
