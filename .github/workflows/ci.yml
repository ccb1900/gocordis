name: ci

on:
  push:
  pull_request:

env:
  # Reproducible toolchain: read by actions/setup-go. Local policy documented in
  # docs/plan/baseline.md (version-fox-managed Go 1.26.0; GOCACHE is per-run /
  # per-workspace, never a developer-global cache shared across toolchains).
  GO_VERSION_FILE: .go-version

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Format check
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Race (repeated, concurrency-sensitive suites)
        run: |
          go test -race ./runtime/ -count=3
          go test -race ./integration/ -count=3
          go test -race ./extensions/hmr/ -count=3
          go test -race ./cmd/httpd/ -count=3

  windows-build:
    # W-2（R14）：编译层守住 Windows 兼容——build + vet + 测试二进制交叉
    # 编译，零成本防回退。windows-latest 原生测试 job 可后补（-race 需镜像
    # 自带 mingw）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Windows build
        run: GOOS=windows go build ./...

      - name: Windows vet
        run: GOOS=windows go vet ./...

      # Cross-compile the test binaries ONLY (`go test -c`). Plain `go test`
      # would try to EXECUTE the windows .exe on the linux runner and die with
      # "exec format error". Packages without test files are skipped because
      # `go test -c` rejects them.
      - name: Windows test compile (cross-compile only, never executed)
        run: |
          set -euo pipefail
          pkgs=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)
          if [ -z "$pkgs" ]; then
            echo "no test packages"; exit 0
          fi
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          fail=0
          i=0
          for pkg in $pkgs; do
            i=$((i+1))
            if ! GOOS=windows go test -c -o "$tmpdir/t$i.test.exe" "$pkg"; then
              echo "windows test compile failed: $pkg"; fail=1
            fi
          done
          exit $fail

  console-web:
    # UI-01..03 的前端门面是插件 ABI：vitest + tsc 必须在 CI 执行，
    # 不能只靠提交说明里"本地跑过"（联合审查 P2）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - name: npm ci
        working-directory: web/console
        run: npm ci

      - name: Vitest
        working-directory: web/console
        run: npm test

      - name: TypeScript check
        working-directory: web/console
        run: npx tsc --noEmit

      - name: Production build (tsc + vite)
        working-directory: web/console
        run: npm run build
